{{- if and .Values.community false (eq .Values.type "multicluster-replicaSet" ) }}
apiVersion: mongodb.com/v1
kind: MongoDBMultiCluster
metadata:
 name: {{ .Values.name }}
 namespace: {{ .Release.Namespace }}
spec:
 version: {{ .Values.version }}
 type: ReplicaSet
 duplicateServiceObjects: true
 credentials: {{ .Values.projectName }}-organization-secret
 opsManager:
   configMapRef:
     name: {{ .Values.projectName }}-cm
 security:
    authentication:
        enabled: {{ .Values.authEnabled }}
        modes: ["SCRAM"]
    {{- if eq .Values.tlsEnabled true }}
   certsSecretPrefix: {{ .Values.projectName }}-certs
   tls:
     ca: custom-ca
    {{- end }}
 clusterSpecList:
{{- range .Values.multicluster.clusters }}
   - clusterName: {{ .name }}
     externalAccess:
       externalDomain: {{ .externalDomain }}
     members: {{ $.Values.multicluster.membersPerCluster }}
{{- end }}
{{- end }}
