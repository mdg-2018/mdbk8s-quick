
{{- if and .Values.community false (eq .Values.type "replicaSet" )}}
apiVersion: mongodb.com/v1
kind: MongoDB
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Release.Namespace }}
spec:
  type: ReplicaSet
  members: {{ .Values.members }}
  version: "{{ .Values.version }}"
  persistent: true
  opsManager:
    configMapRef:
      name: {{ .Values.projectName }}-cm
  credentials: {{ .Values.projectName }}-organization-secret
  # Disable authentication to be able to manage the database without credentials
  # do not do this in production environments
  security:
    authentication:
      enabled: {{ .Values.authEnabled }}
      modes: ["SCRAM"]
    {{- if eq .Values.tlsEnabled true }}
    tls:
      enabled: true
      ca: {{ .Values.name }}-mdb-tls-ca-configmap
    {{- end }} # - if eq .Values.tlsEnabled true
  
  ## Expose cluster externally
  {{- if eq .Values.externalAccessEnabled true }}
  externalAccess:
    externalService:
      spec:
        type: LoadBalancer
  {{- end }}
{{- end }}