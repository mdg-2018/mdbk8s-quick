{{- if eq .Values.community false }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.projectName }}-cm
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
data:
  baseUrl: {{ .Values.omUrl }}
  projectName: {{ .Values.projectName }}
  orgId: {{ .Values.omOrgId }}
  {{- end }} # if and .Values.community false