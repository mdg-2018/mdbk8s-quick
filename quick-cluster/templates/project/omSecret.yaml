{{- if and .Values.community false }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.projectName }}-organization-secret
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
stringData:
  publicKey: {{ .Values.omPublicKey }}
  privateKey: {{ .Values.omPrivateKey }}
{{- end }} # if and .Values.community false
