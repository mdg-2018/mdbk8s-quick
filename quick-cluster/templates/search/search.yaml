{{- if eq .Values.searchEnabled true }}

apiVersion: mongodb.com/v1
kind: MongoDBSearch
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Release.Namespace }}
spec:
  {{- if eq .Values.tlsEnabled true }}
  security:
    tls:
      certsSecretPrefix: ""
  {{- end }} # - if eq .Values.tlsEnabled true
  {{- if .Values.searchAutoEmbedding.enabled }}
  autoEmbedding:
    providerEndpoint: {{ .Values.searchAutoEmbedding.providerEndpoint }}
    embeddingModelAPIKeySecret:
      name: auto-embedding-key-secret
  {{- end }} # - if .Values.searchAutoEmbedding.enabled
  clusters:
    - replicas: {{ .Values.searchReplicas }}
      loadBalancer:
        managed:
          replicas: {{ .Values.searchLoadBalancerReplicas }}
      resourceRequirements:
        limits:
          cpu: "1"
          memory: 1Gi
        requests:
          cpu: "1"
          memory: 1Gi
{{- end }}