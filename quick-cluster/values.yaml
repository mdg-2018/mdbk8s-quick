# General info
omPublicKey: "your-om-public-key"
omPrivateKey: "your-om-private-key"
opsManagerUrl: "https://cloud.mongodb.com" # Leave this value as-is if using cloud manager, otherwise set it to your Ops Manager URL
name: "my-replica-set" # name of your cluster
projectName: "my-project"
orgId: "your-org-id"
version: "8.3.7"

# Deploy community instead of enterprise
# This ignores all Ops Manager settings!
community: false

# Tools
launchClientPod: false

# External access settings
externalAccessEnabled: false

# Authentication
authEnabled: true
rootPassword: "password"
searchSyncUserPassword: "password"

# Cluster topology
members: 3 # This will be the number of members in your replica set OR members per shard in a sharded cluster
type: "replicaSet" # "replicaSet" / "shardedCluster" / "multicluster-replicaSet" / "multicluster-shardedCluster"

# Sharded Cluster Settings
shards: 2
mongosCount: 2
configServerCount: 1

# Search Settings
searchEnabled: false
searchReplicas: 2
searchLoadBalancerReplicas: 1
searchAutoEmbedding:
  enabled: false
  providerEndpoint: "https://ai.mongodb.com/v1/embeddings"
  queryKey: ""
  indexingKey: ""

# TLS settings
tlsEnabled: false
certManagerNamespace: cert-manager # Namespace where cert-manager is installed

# Multicluster settings
multicluster:
  membersPerCluster: 1
  externalDomain: "example.com"

  # Cluster names should match kubeconfig context names
  clusters:
    - name: "cluster-1"
      externalDomain: "cluster-1.example.com"
    - name: "cluster-2"
      externalDomain: "cluster-2.example.com"