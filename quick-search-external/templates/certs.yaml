### Generate certificate chain if tlsEnabled = true
{{- if eq .Values.tlsEnabled true }}
{{- if eq .Values.tlsCAFileSecretName "" }}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.name }}-self-signed-issuer
spec:
  selfSigned: {}

---

apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: tls-ca
  namespace: {{ .Values.certManagerNamespace }}
spec:
  isCA: true
  commonName: mongodb-ca
  secretName: tls-ca-secret
  duration: 87600h  # 10 years
  renewBefore: 8760h  # 1 year
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: {{ .Values.name }}-self-signed-issuer
    kind: ClusterIssuer

---
{{- end }} # - if eq .Values.tlsCAFileSecretName ""

apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.name }}-tls-ca-issuer
spec:
  ca:
    secretName: tls-ca-secret

---

apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: {{ .Values.name }}-mdb-tls-ca-configmap
  namespace: {{ .Release.Namespace }}
spec:
  sources:
    - secret:
        name: "tls-ca-secret"
        key: "tls.crt"
  target:
    configMap:
      key: "ca-pem"
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ .Release.Namespace | quote }}

---

### Generate search certs if replica set
{{- if eq .Values.clusterType "replicaSet" }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.name }}-search-cert
  namespace: {{ .Release.Namespace }}
spec:
  secretName: {{ .Values.name }}-search-cert
  duration: 8760h    # 1 year
  renewBefore: 720h  # 30 days
  privateKey:
    algorithm: RSA
    size: 2048
  usages:
    - server auth
    - client auth
  dnsNames:
    - "*.{{ .Values.name }}-svc.mongodb.svc.cluster.local"
  issuerRef:
    name: {{ .Values.name }}-tls-ca-issuer
    kind: ClusterIssuer

---
{{- end }} # - if eq .Values.clusterType "replicaSet"

### Generate search certs for each shard if sharded cluster
{{- if eq .Values.clusterType "shardedCluster" }}
{{- $count := .Values.shards }}
{{- range $i := until ( $count | int) }}
{{- $searchReplicaCount := $.Values.searchReplicas }}
{{- range $j := until ( $searchReplicaCount | int) }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: "{{ $.Values.name }}-search-{{ $j }}-{{ $.Values.name }}-{{ $i }}-cert"
  namespace: {{ $.Release.Namespace }}
spec:
  secretName: "{{ $.Values.name }}-search-{{ $j }}-{{ $.Values.name }}-{{ $i }}-cert"
  duration: 8760h    # 1 year
  renewBefore: 720h  # 30 days
  privateKey:
    algorithm: RSA
    size: 2048
  usages:
    - server auth
    - client auth
  dnsNames:
    - "*.{{ $.Values.name }}-search-{{ $j }}-{{ $.Values.name }}-{{ $i }}-svc.mongodb.svc.cluster.local"
  issuerRef:
    name: {{ $.Values.name }}-tls-ca-issuer
    kind: ClusterIssuer
---
{{- end }} # - range $j := until (add1 $searchReplicaCount | int)
{{- end }} # - range $i := until (add1 $count | int)
{{- end }} # - if eq .Values.clusterType "shardedCluster"


### Envoy LB certificates
{{- $count := .Values.searchLoadBalancerReplicas }}
{{- range $i := until ( $count | int) }}

# Create a certificate for use by envoy load balancer
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $.Values.name }}-search-lb-{{ $i }}-cert
  namespace: {{ $.Release.Namespace }}
spec:
  secretName: {{ $.Values.name }}-search-lb-{{ $i }}-cert
  duration: 8760h    # 1 year
  renewBefore: 720h  # 30 days
  privateKey:
    algorithm: RSA
    size: 2048
  usages:
    - server auth
  dnsNames:
    - "*.{{ $.Release.Namespace }}.svc.cluster.local"
    - "*.{{ .Values.searchExternalHostname }}"
  issuerRef:
    name: {{ $.Values.name }}-tls-ca-issuer
    kind: ClusterIssuer

---

# Create client certificate for envoy load balancer
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $.Values.name }}-search-lb-{{ $i }}-client-cert
  namespace: {{ $.Release.Namespace }}
spec:
  secretName: {{ $.Values.name }}-search-lb-{{ $i }}-client-cert
  duration: 8760h    # 1 year
  renewBefore: 720h  # 30 days
  privateKey:
    algorithm: RSA
    size: 2048
  usages:
    - client auth
  dnsNames:
    - "*.{{ $.Release.Namespace }}.svc.cluster.local"
    - "*.{{ .Values.searchExternalHostname }}"
  issuerRef:
    name: {{ $.Values.name }}-tls-ca-issuer
    kind: ClusterIssuer
---
{{- end }} # - range $i := until ( $count | int)
{{- end }} # - if eq .Values.tlsEnabled true