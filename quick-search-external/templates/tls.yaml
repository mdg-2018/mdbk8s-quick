{{- if .Values.tlsEnabled }}
apiVersion: v1
data:
  ca.crt: |-
    {{ .Values.tlsCA | nindent 4 }}
kind: ConfigMap
metadata:
  name: {{ .Values.name }}-search-tls-ca-configmap
  namespace: mongodb

---

apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.name }}-self-signed-issuer
spec:
  selfSigned: {}

---

apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: tls-ca
  namespace: {{ .Values.certManagerNamespace }}
spec:
  isCA: true
  commonName: mongodb-ca
  secretName: tls-ca-secret
  duration: 87600h  # 10 years
  renewBefore: 8760h  # 1 year
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: {{ .Values.name }}-self-signed-issuer
    kind: ClusterIssuer

---

apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.name }}-tls-ca-issuer
spec:
  ca:
    secretName: tls-ca-secret

---

{{- if or (eq .Values.extClusterType "replicaSet") .Values.community }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.name }}-search-cert
  namespace: {{ .Release.Namespace }}
spec:
  secretName: {{ .Values.name }}-search-cert
  duration: 8760h    # 1 year
  renewBefore: 720h  # 30 days
  privateKey:
    algorithm: RSA
    size: 2048
  usages:
    - server auth
    - client auth
  dnsNames:
    - "*.{{ .Values.name }}-svc.mongodb.svc.cluster.local"
  issuerRef:
    name: {{ .Values.name }}-tls-ca-issuer
    kind: ClusterIssuer

---
{{- end }} # - if eq .Values.type "replicaSet"

### Envoy LB certificates
{{- $count := .Values.searchLoadBalancerReplicas }}
{{- range $i := until ( $count | int) }}

