apiVersion: mongodb.com/v1
kind: MongoDBSearch
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Release.Namespace }}
spec:
  {{- if eq .Values.tlsEnabled true }}
  security:
    tls:
      certsSecretPrefix: ""
  {{- end }} # - if eq .Values.tlsEnabled true
  {{- if .Values.searchAutoEmbedding.enabled }}
  autoEmbedding:
    providerEndpoint: {{ .Values.searchAutoEmbedding.providerEndpoint }}
    embeddingModelAPIKeySecret:
      name: auto-embedding-key-secret
  {{- end }} # - if .Values.searchAutoEmbedding.enabled
  source:
    username: {{ .Values.searchSyncUser }}
    passwordSecretRef:
      name: {{ .Values.name }}-search-sync-source-password
      key: password
    external:
      hostAndPorts: {{ toJson .Values.externalHostAndPorts }}
      {{- if .Values.tlsEnabled }}
      tls:
        ca:
          name: {{ .Values.name }}-search-tls-ca-configmap
      {{- end }} # - if .Values.tlsEnabled
  {{- if .Values.opsManager.metricsEnabled }}
  observability:
    metricsForwarder:
      opsManager:
        agentCredentials:
          name: {{ .Values.name }}-agent-api-key-secret
        projectConfigMapRef:
          name: {{ .Values.name }}-ops-manager-project-configmap
  {{- end }} # - if .Values.opsManager.metricsEnabled
  clusters:
    - replicas: {{ .Values.searchReplicas }}
      loadBalancer:
        managed:
          replicas: {{ .Values.searchLoadBalancerReplicas }}
          externalHostname: {{ .Values.searchExternalHostname }}
      resourceRequirements:
        limits:
          cpu: {{ .Values.searchCPU }}
          memory: {{ .Values.searchMemory }}
        requests:
          cpu: {{ .Values.searchCPU }}
          memory: {{ .Values.searchMemory }}
    
---

apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.name }}-search-sync-source-password
  namespace: {{ .Release.Namespace }}
stringData:
  password: {{ .Values.searchSyncUserPassword }}

---

apiVersion: v1
kind: Service
metadata:
  # labels:
  #   app: {{ .Values.name }}-search-0-proxy-svc
  name: {{ .Values.name }}-search-0-ext-lb
  namespace: {{ .Release.Namespace }}
spec:
  ports:
    - name: 27028-27028
      port: 27028
      protocol: TCP
      targetPort: 27028
  selector:
    app: {{ .Values.name }}-search-0-proxy-svc
  type: LoadBalancer

---

{{- if .Values.opsManager.metricsEnabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.name }}-agent-api-key-secret
  namespace: {{ .Release.Namespace }}
stringData:
  agentApiKey: {{ .Values.opsManager.agentAPIKey }}

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.name }}-ops-manager-project-configmap
  namespace: {{ .Release.Namespace }}
data:
  baseUrl: {{ .Values.opsManager.baseURL }}
  projectName: {{ .Values.opsManager.projectName }}
  orgId: {{ .Values.opsManager.orgId }}

{{- end }}